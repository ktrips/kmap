name: Komap
options:
  bundleIdPrefix: com.komap
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Komap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Komap
        excludes:
          - "Resources/Info.plist"
    info:
      path: Komap/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Komap 古地図巡り"
        GMSApiKey: "$(GOOGLE_MAPS_API_KEY)"
        OpenAIApiKeyDefault: "$(OPENAI_API_KEY_DEFAULT)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "現在地を地図に表示し、あなたが今いる場所の昔の姿をAIが解説するために位置情報を使用します。"
        NSLocationAlwaysAndWhenInUseUsageDescription: "散策中に現在地を地図に表示し、その場所の昔の姿をAIが解説するために位置情報を使用します。"
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - googlechromes
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komap.Komap
        PRODUCT_NAME: Komap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: "Komap Watch App"
        embed: true

  KomapWatchApp:
    name: "Komap Watch App"
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: "Komap Watch App"
    info:
      path: "Komap Watch App/Info.plist"
      properties:
        CFBundleDisplayName: "Komap"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.komap.Komap
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komap.Komap.watchkitapp
        PRODUCT_NAME: "Komap Watch App"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

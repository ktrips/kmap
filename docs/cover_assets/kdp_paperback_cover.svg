<svg xmlns="http://www.w3.org/2000/svg" width="430.93mm" height="263.35mm" viewBox="0 0 430.93 263.35">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1826"/>
      <stop offset="55%" stop-color="#0F2A44"/>
      <stop offset="100%" stop-color="#123A52"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#33D6C0" stroke-width="0.12" opacity="0.16"/>
    </pattern>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect x="0" y="0" width="430.93" height="263.35" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="430.93" height="263.35" fill="url(#grid)"/>

  <!-- Soft glow accents -->
  <circle cx="392" cy="34" r="58" fill="#33D6C0" opacity="0.14" filter="url(#blur1)"/>
  <circle cx="46" cy="236" r="66" fill="#F2B84B" opacity="0.10" filter="url(#blur1)"/>
  <circle cx="216" cy="132" r="90" fill="#33D6C0" opacity="0.06" filter="url(#blur1)"/>

  <!-- Decorative GPS trail crossing the whole spread -->
  <polyline points="18,228 68,192 128,222 186,158 216,140 248,170 300,128 352,150 404,108"
            fill="none" stroke="#F2B84B" stroke-width="0.8" stroke-dasharray="1.4,2.6" opacity="0.45"/>
  <g fill="#F2B84B" opacity="0.75">
    <circle cx="18" cy="228" r="1.6"/>
    <circle cx="128" cy="222" r="1.6"/>
    <circle cx="216" cy="140" r="1.6"/>
    <circle cx="300" cy="128" r="1.6"/>
    <circle cx="404" cy="108" r="2.1"/>
  </g>

  <!-- ============= BACK COVER (left) ============= -->
  <g>
    <!-- contrast panel -->
    <rect x="9" y="22" width="200" height="146" rx="6" fill="#05121F" opacity="0.34"/>

    <text x="19.175" y="40" font-family="Hiragino Sans W7" font-size="8.6" fill="#FFFFFF">週末だけで、動くところまで。</text>
    <text x="19.175" y="49.5" font-family="Hiragino Sans W4" font-size="4.1" fill="#BFD3E0">個人開発者のためのiOSアプリ開発 × 収益化実践ガイド</text>

    <text font-family="Hiragino Sans W4" font-size="4.5" fill="#E7EEF3">
      <tspan x="19.175" y="64">本業を続けながら"週末"だけでiOSアプリを</tspan>
      <tspan x="19.175" y="71.4">企画・開発・収益化する――。</tspan>
      <tspan x="19.175" y="78.8">位置情報×ゲーミフィケーションアプリ「Komap」の</tspan>
      <tspan x="19.175" y="86.2">開発を題材に、金曜夜から月曜朝までの</tspan>
      <tspan x="19.175" y="93.6">48〜60時間で、企画からMVP実装、Web公開、</tspan>
      <tspan x="19.175" y="101">App Store審査提出までを完走させる</tspan>
      <tspan x="19.175" y="108.4">実践的方法論を解説する。</tspan>
    </text>

    <text x="19.175" y="123" font-family="Hiragino Sans W7" font-size="5.2" fill="#F2B84B">本書の特徴</text>
    <text font-family="Hiragino Sans W4" font-size="4.3" fill="#E7EEF3">
      <tspan x="19.175" y="133">・「1つの週末」で作りきる意思決定フレームワーク</tspan>
      <tspan x="19.175" y="140">・Swift・Firebase・Google Maps SDK実装解説</tspan>
      <tspan x="19.175" y="147">・収益化・ASO・マーケティング編を独立収録</tspan>
      <tspan x="19.175" y="154">・ジョブズ／ティール／マスクの思考法を収益化に応用</tspan>
    </text>

    <rect x="9" y="169" width="150" height="13" rx="6.5" fill="#05121F" opacity="0.34"/>
    <text x="19.175" y="177.5" font-family="Hiragino Sans W6" font-size="4.6" fill="#F2B84B">次の週末、あなたのアプリをリリースしよう。</text>

    <!-- Barcode reserved area (KDP places the barcode here automatically) -->
    <rect x="154.375" y="214.695" width="50.80" height="30.48" fill="#FFFFFF"/>
  </g>

  <!-- ============= FRONT COVER (right) ============= -->
  <g>
    <!-- contrast panel -->
    <rect x="220" y="56" width="204" height="198" rx="8" fill="#05121F" opacity="0.36"/>

    <text x="322.755" y="34" font-family="Hiragino Sans W5" font-size="4.6" fill="#8FD9CC" text-anchor="middle" letter-spacing="1.5">週末ひとり開発シリーズ</text>

    <text font-family="Hiragino Sans W8" font-size="15" fill="#FFFFFF" text-anchor="middle">
      <tspan x="322.755" y="82">週末だけで</tspan>
      <tspan x="322.755" y="102">地図ゲームアプリを</tspan>
      <tspan x="322.755" y="122">作って収益化する方法</tspan>
    </text>

    <line x1="292.755" y1="132" x2="352.755" y2="132" stroke="#F2B84B" stroke-width="0.8"/>

    <text font-family="Hiragino Sans W4" font-size="5.4" fill="#D3E1EA" text-anchor="middle">
      <tspan x="322.755" y="144">Swift・Firebase・Google Maps SDKで学ぶ</tspan>
      <tspan x="322.755" y="153">個人開発者のためのiOSアプリ開発</tspan>
      <tspan x="322.755" y="162">〜ASO・マネタイズ実践ガイド</tspan>
    </text>

    <!-- Badge: GPS x gamification -->
    <circle cx="322.755" cy="203" r="21" fill="none" stroke="#F2B84B" stroke-width="1.1"/>
    <circle cx="322.755" cy="203" r="17.5" fill="none" stroke="#33D6C0" stroke-width="0.5" opacity="0.7"/>
    <path d="M322.755 194.5c-4.4 0-8 3.5-8 7.9 0 5.9 8 12.6 8 12.6s8-6.7 8-12.6c0-4.4-3.6-7.9-8-7.9z" fill="#F2B84B"/>
    <circle cx="322.755" cy="202.2" r="2.6" fill="#0A1826"/>
    <text x="322.755" y="230" font-family="Hiragino Sans W5" font-size="4.2" fill="#8FD9CC" text-anchor="middle">GPS × ゲーミフィケーション</text>

    <text x="322.755" y="247" font-family="Hiragino Sans W6" font-size="7.6" fill="#FFFFFF" text-anchor="middle">𠮷 田　顕 一</text>
  </g>
</svg>

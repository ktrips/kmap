name: Catalog check

# 古地図・史跡チェックポイントの一覧は catalog/*.json だけで管理し、iOS（Swift）と Web（TypeScript）の
# データファイルは scripts/generate-catalog.mjs で生成する。生成し忘れ（JSONと生成ファイルの食い違い）を検出する。
on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "Komap/Models/Generated/**"
      - "web/src/lib/generated/**"
      - "scripts/generate-catalog.mjs"
      - ".github/workflows/catalog-sync.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "Komap/Models/Generated/**"
      - "web/src/lib/generated/**"
      - "scripts/generate-catalog.mjs"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-catalog.mjs --check
